# Reverse proxy for the VPS (Nginx running natively on the host, outside Docker).
# Front and API on the SAME domain, with /api/* going to the backend.
#
# Three things here are NOT optional — each one is a real failure that this
# app's traffic runs into.

server {
    listen 80;
    server_name _;

    # The default is 1 MB and an audio goes up to 25 MB. Without this, every
    # upload bigger than a voice memo takes a 413 AT THE PROXY and never reaches
    # the backend — which then looks like a bug in the app.
    client_max_body_size 30m;

    # An upload of 25 MB over a phone connection takes a while; the default
    # 60s read timeout would cut it off mid-transfer.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # SSE needs its own block: with buffering on (the default) Nginx holds the
    # events until its buffer fills, so the page looks frozen — exactly the wait
    # the live push exists to remove. HTTP/1.1 + an empty Connection header is
    # what keeps the connection open at all.
    location = /api/notification/stream {
        proxy_pass http://127.0.0.1:5000/notification/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        # A stream is supposed to sit idle between events; a normal read timeout
        # would kill it every minute and make EventSource reconnect forever.
        proxy_read_timeout 24h;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ⚠️ While this is `listen 80` without TLS, LOGIN DOES NOT PERSIST: the refresh
# cookie is `secure` (NODE_ENV=production in the Dockerfile), and a browser does
# not store a `secure` cookie over plain HTTP. Run certbot before using this for
# real.
