# Reverse proxy da VPS (Nginx nativo no host, fora do Docker). Front e API no
# MESMO domínio, com /api/* indo pro backend.
#
# Este arquivo é o ESPELHO do que roda em /etc/nginx/sites-available/audio-mind.
# Mudou aqui, copia pra lá:
#
#     sudo cp deploy/nginx.conf /etc/nginx/sites-available/audio-mind
#     sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ AS PORTAS AQUI TÊM QUE BATER com as que o `docker-compose.yml` publica no
# host (5002 pro backend, 3004 pro front). Divergir dá 502, que parece app
# derrubado.
#
# ⚠️ As linhas marcadas `# managed by Certbot` são dele, na posição em que ele as
# escreveu — inclusive o `listen 443` ficar no FIM do bloco e o redirect do 80
# ser um `if ($host = ...)` com `return 404` depois. Não reorganize: o certbot
# reescreve esse arquivo ao renovar, e ele espera encontrar o próprio formato. Se
# ele mexer em algo lá, traga a mudança pra cá, senão este vira uma foto
# desatualizada do que está rodando.
#
# Quatro coisas aqui NÃO são opcionais — cada uma é uma falha real que o tráfego
# deste app encontra.

server {
    server_name audio-mind.devedev.com;

    # The default is 1 MB and an audio goes up to 25 MB. Without this, every
    # upload bigger than a voice memo takes a 413 AT THE PROXY and never reaches
    # the backend — which then looks like a bug in the app.
    client_max_body_size 30m;

    # An upload of 25 MB over a phone connection takes a while; the default
    # 60s read timeout would cut it off mid-transfer.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # SSE needs its own block: with buffering on (the default) Nginx holds the
    # events until its buffer fills, so the page looks frozen — exactly the wait
    # the live push exists to remove. HTTP/1.1 + an empty Connection header is
    # what keeps the connection open at all.
    location = /api/notification/stream {
        proxy_pass http://127.0.0.1:5002/notification/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        # A stream is supposed to sit idle between events; a normal read timeout
        # would kill it every minute and make EventSource reconnect forever.
        proxy_read_timeout 24h;
    }

    # O streaming de áudio também precisa de buffering desligado: com ele ligado
    # o Nginx tenta ler a resposta inteira do upstream antes de responder, que é
    # o oposto do que um Range pede — o navegador quer 300 KB perto do minuto 40,
    # não o arquivo. `proxy_force_ranges` mantém o Range funcionando mesmo quando
    # a resposta chega sem um Accept-Ranges que o Nginx aceite.
    #
    # ⚠️ Estes dois blocos precisam vir ANTES do `location /api/`: aquele é
    # prefixo genérico e pegaria estas rotas primeiro.
    location /api/recording/stream/ {
        proxy_pass http://127.0.0.1:5002/recording/stream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_force_ranges on;
    }

    # Um link compartilhado pode levar o áudio, e essa rota também toca por Range
    # — mesmo motivo do bloco acima, autorização diferente (o token no caminho,
    # em vez do token de capacidade na query string).
    location /api/share/public/ {
        proxy_pass http://127.0.0.1:5002/share/public/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_force_ranges on;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/audio-mind.devedev.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/audio-mind.devedev.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# O TLS acima é o que faz o LOGIN PERSISTIR: o cookie de refresh é `secure`
# (NODE_ENV=production no Dockerfile), e o navegador descarta cookie `secure` em
# HTTP puro — sem certificado, a sessão morre em cada recarregamento. Por isso o
# bloco 80 abaixo só redireciona e nunca serve o app.
server {
    if ($host = audio-mind.devedev.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name audio-mind.devedev.com;
    return 404; # managed by Certbot


}
