# Reverse proxy da VPS (Nginx nativo no host, fora do Docker). Front e API no
# MESMO domínio, com /api/* indo pro backend.
#
# Este arquivo é o espelho do que roda em /etc/nginx — mudou aqui, copia pra lá:
#
#     sudo cp deploy/nginx.conf /etc/nginx/sites-available/audio-mind
#     sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ AS PORTAS AQUI TÊM QUE BATER com as que o `docker-compose.yml` publica no
# host (5002 pro backend, 3004 pro front). Divergir dá 502, que parece app
# derrubado.
#
# ⚠️ O CERTBOT edita o arquivo de /etc/nginx sozinho quando renova o
# certificado. Se ele mexer em algo, traga a mudança pra cá também — senão este
# vira uma foto desatualizada do que está rodando.
#
# Quatro coisas aqui NÃO são opcionais — cada uma é uma falha real que o tráfego
# deste app encontra.

# HTTP só redireciona. É o que o certbot monta, e é o que faz o cookie de
# refresh (que é `secure`) chegar a ser guardado pelo navegador: em HTTP puro ele
# é descartado e o login não persiste entre recarregamentos.
server {
    listen 80;
    server_name audio-mind.devedev.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name audio-mind.devedev.com;

    # Gerados pelo certbot. Confira os caminhos com `sudo ls
    # /etc/letsencrypt/live/` — o nome da pasta segue o domínio do primeiro
    # certificado emitido, e nem sempre é igual ao server_name.
    ssl_certificate /etc/letsencrypt/live/audio-mind.devedev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/audio-mind.devedev.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The default is 1 MB and an audio goes up to 25 MB. Without this, every
    # upload bigger than a voice memo takes a 413 AT THE PROXY and never reaches
    # the backend — which then looks like a bug in the app.
    client_max_body_size 30m;

    # An upload of 25 MB over a phone connection takes a while; the default
    # 60s read timeout would cut it off mid-transfer.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # SSE needs its own block: with buffering on (the default) Nginx holds the
    # events until its buffer fills, so the page looks frozen — exactly the wait
    # the live push exists to remove. HTTP/1.1 + an empty Connection header is
    # what keeps the connection open at all.
    location = /api/notification/stream {
        proxy_pass http://127.0.0.1:5002/notification/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        # A stream is supposed to sit idle between events; a normal read timeout
        # would kill it every minute and make EventSource reconnect forever.
        proxy_read_timeout 24h;
    }

    # The audio stream also needs buffering off: with it on, Nginx tries to read
    # the whole upstream response before answering, which throws away the point
    # of a Range request — the browser asked for 300 KB around a timestamp, not
    # for the file. `proxy_force_ranges` keeps ranges working even when the
    # upstream answer arrives without an Accept-Ranges Nginx trusts.
    location /api/recording/stream/ {
        proxy_pass http://127.0.0.1:5002/recording/stream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_force_ranges on;
    }

    # A shared link may carry the audio, and that route streams by Range too —
    # same reasoning as the block above, different authorization (the token in
    # the path instead of a capability in the query string).
    location /api/share/public/ {
        proxy_pass http://127.0.0.1:5002/share/public/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_force_ranges on;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

